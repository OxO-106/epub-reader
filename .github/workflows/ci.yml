# Checks every push and pull request: typecheck, then the API and unit tests (Vitest), on Windows and Linux.
# Nothing here needs the translation model or the real Chinese font: the tests use their stand-ins.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer run on the same branch or pull request cancels the one still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API and unit tests
        run: npm test
