# Checks every push and pull request on Windows and Linux: typecheck and the API and unit tests (Vitest), then, once
# those pass, the browser tests (Playwright, with its own Chromium; the report and traces are uploaded when they fail).
# Nothing here needs the translation model or the real Chinese font: the tests use their stand-ins.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer run on the same branch or pull request cancels the one still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API and unit tests
        run: npm test

  browser-tests:
    name: Browser tests (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Playwright's Chromium, cached per Playwright version (the config uses it when CI is set).
      - name: Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Build and run the browser tests
        run: npm run test:e2e

      # The README's screenshots come from this script; running it here (output thrown away) keeps it working.
      - name: Screenshot script still works
        if: runner.os == 'Linux'
        run: npm run screenshots -- --out "${{ runner.temp }}/screenshots"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
