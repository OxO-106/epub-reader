# Pushing a version tag (made by `npm run release`) publishes a GitHub Release: the tag must match package.json and
# have a section in CHANGELOG.md, the checks must pass, and the built web front end is attached. Then the Windows
# installer of the desktop app is built (with the Chinese font's web pieces) and attached, with the latest.yml that the
# installed apps read to update themselves.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Release notes from the changelog (also checks the tag against package.json)
        run: node scripts/release-notes-cli.ts "${{ github.ref_name }}" > release-notes.md

      - name: Typecheck
        run: npm run typecheck

      - name: API and unit tests
        run: npm test

      - name: Build the web front end
        run: npm run build

      - name: Archive the build
        run: tar -czf "reader-web-${{ github.ref_name }}.tar.gz" -C dist web

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "Reader ${{ github.ref_name }}"
          --notes-file release-notes.md
          --verify-tag
          "reader-web-${{ github.ref_name }}.tar.gz"

  desktop:
    name: Windows installer for ${{ github.ref_name }}
    needs: release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: |
          npm ci
          node node_modules/electron/install.js
          pip install fonttools brotli

      - name: Build the Chinese font's web pieces
        run: npm run fonts:build

      - name: Build the front end and the installer
        run: |
          npm run build
          npm run runtime
          npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # The packaged app as the installer ships it must start and show the Library before anything is attached.
      - name: Start the packaged app once
        run: npx playwright test --config playwright.desktop.config.ts -g "packaged app"
        env:
          READER_DESKTOP_EXE: ${{ github.workspace }}/release/win-unpacked/Verso.exe

      # The release already exists (the job above made it): the installer, its block map and latest.yml (which installed
      # apps read to update themselves) are added to it.
      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" release/Verso-Setup-*.exe release/Verso-Setup-*.exe.blockmap release/latest.yml --clobber
