    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="aspect-ratio: 2 / 3; border-radius: 3px 6px 6px 3px; background: #26344f; box-shadow: 0 8px 22px rgba(40,30,20,0.12); padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; color: #eef1f6; font-family: 'Libertinus Serif', Georgia, serif; font-size: 20px; line-height: 1.1"><span style="width: 20px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.55); margin-bottom: auto"></span>Moby-Dick</div>

      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #69645b"><span>曹雪芹</span><span style="color: #8f3d21; font-weight: 600">New</span></div>
    </div>
  </div>
</div>
