<p style="margin: 0 0 18px; font-size: 18px; line-height: 1.95; text-indent: 2em">此开卷第一回也。作者自云：因曾历过一番梦幻之后，故将真事隐去，而借“通灵”之说，撰此《石头记》一书也。故曰“甄士隐”云云。</p>
<p style="margin: 0 0 18px; font-size: 18px; line-height: 1.95; text-indent: 2em">但书中所记何事何人？自己又云：“今风尘碌碌，一事无成，忽念及当日所有之女子，一一细考较去，觉其行止见识，皆出于我之上。”</p>
<p style="margin: 0 0 18px; font-size: 18px; line-height: 1.95; text-indent: 2em">当日地陷东南，这东南一隅有处曰姑苏，有城曰阊门者，最是红尘中一二等富贵风流之地。</p>
